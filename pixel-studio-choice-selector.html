<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Pixel Night Studio — Choose 2 (Auto Collapse)</title>
<style>
  :root{
    --ui-bg:#0e0f14;
    --ui-text:#e5e7eb;
  }
  html,body{
    height:100%;margin:0;background:var(--ui-bg);color:var(--ui-text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Lucida Console", monospace;
  }
  .px-text{
    text-transform:uppercase; letter-spacing:1px; font-weight:700;
    -webkit-font-smoothing:none; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeSpeed;
    text-shadow:0 1px 0 rgba(0,0,0,.55), 1px 0 0 rgba(0,0,0,.45), 1px 1px 0 rgba(0,0,0,.35);
  }

  #wrap{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:16px}
  header{
    background:linear-gradient(180deg,#141724,#0f1120);
    border:1px solid #22263a;padding:10px 12px;border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
    min-height:24px; /* 仅保留外观 */
  }

  #canvasWrap{
    position:relative;background:#0b0d14;border:1px solid #1b1f33;border-radius:14px;
    box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)
  }
  #screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

  footer{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:#121425;border:1px solid #1a1d31;border-radius:12px;padding:10px 12px
  }
  #status{opacity:.95; cursor:pointer} /* 点击可重新展开 */
  #legend{display:flex;gap:8px;flex-wrap:wrap}
  .pill{
    border:1px solid #273052;border-radius:6px;padding:6px 10px;color:#c7d2fe;background:rgba(99,102,241,.08);
    font-size:11px
  }

  /* ===== Center Selector Panel ===== */
  #selector{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1);
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:16px 18px;
    background:rgba(10,13,22,.78);
    border:2px solid #26304d; border-radius:12px;
    box-shadow:
      0 0 0 2px rgba(30,64,175,.30),
      0 14px 32px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(3px);
    pointer-events:auto;
    transition: opacity .45s cubic-bezier(.2,.7,.2,1), transform .45s cubic-bezier(.2,.7,.2,1), filter .45s;
  }
  #selector.collapsed{
    opacity:0; transform:translate(-50%,-52%) scale(.86); filter:blur(1px);
    pointer-events:none;
  }
  #selectorTitle{font-size:14px}
  #chips{display:flex; gap:14px}
  .chip{
    cursor:pointer; user-select:none;
    border:2px solid #273052; border-radius:10px;
    background:#121528; padding:16px 20px; min-width:128px; text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 26px rgba(0,0,0,.45);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
  }
  .chip span{font-size:16px}
  .chip:hover{transform:translateY(-1px)}
  .chip.active{
    border-color:#3b82f6; background:#0f1a35;
    box-shadow:0 0 0 3px rgba(30,64,175,.35), 0 16px 36px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.06);
    animation: pulse 1.1s infinite steps(2,end);
  }
  @keyframes pulse{
    0%{ filter: drop-shadow(0 0 0 rgba(99,102,241,.0)); }
    50%{ filter: drop-shadow(0 0 10px rgba(99,102,241,.45)); }
    100%{ filter: drop-shadow(0 0 0 rgba(99,102,241,.0)); }
  }
  #selectorHint{font-size:12px; color:#a9b4e6}
  #selectorCount{
    font-size:12px; color:#c7d2fe; padding:4px 8px; border:1px solid #273052; border-radius:6px;
    background:rgba(99,102,241,.08)
  }

  @media (max-width: 500px){
    .chip{min-width:110px; padding:14px 16px}
    .chip span{font-size:14px}
  }
</style>
</head>
<body>
<div id="wrap">
  <header></header>

  <div id="canvasWrap">
    <canvas id="screen"></canvas>

    <!-- 中央选择面板（会自动淡出收起） -->
    <div id="selector">
      <div id="selectorTitle" class="px-text">Select exactly TWO</div>
      <div id="chips">
        <div class="chip"><span class="px-text" data-key="art">ART</span></div>
        <div class="chip"><span class="px-text" data-key="money">MONEY</span></div>
        <div class="chip"><span class="px-text" data-key="sanity">SANITY</span></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div id="selectorHint" class="px-text" style="letter-spacing:.5px">Tap to toggle — up to 2</div>
        <div id="selectorCount" class="px-text">0 / 2</div>
      </div>
    </div>
  </div>

  <footer>
    <div id="status" class="px-text" title="Click to edit choices">Pick exactly TWO options.</div>
    <div id="legend" class="px-text" style="letter-spacing:.5px">
      <span class="pill px-text">ART + MONEY → COMMERCIAL ARTIST</span>
      <span class="pill px-text">ART + SANITY → SOLITARY CREATOR</span>
      <span class="pill px-text">MONEY + SANITY → PRAGMATIC DESIGNER</span>
    </div>
  </footer>
</div>

<script>
(() => {
  // ===== Selection state =====
  const chosen = new Set();
  const chipSpans = [...document.querySelectorAll('.chip span')];
  const statusEl = document.getElementById('status');
  const countEl  = document.getElementById('selectorCount');
  const selector = document.getElementById('selector');

  let collapseTimer = null;

  function collapsePanel(){
    if(!selector.classList.contains('collapsed')){
      selector.classList.add('collapsed');
    }
  }
  function expandPanel(){
    if(selector.classList.contains('collapsed')){
      selector.classList.remove('collapsed');
    }
  }

  function updateStatus(){
    const arr = [...chosen];
    let label = '';
    if(arr.length < 2){
      label = 'Pick exactly TWO options.';
      // 只要少于 2，确保面板是展开的
      clearTimeout(collapseTimer);
      expandPanel();
    } else {
      const has = k => arr.includes(k);
      if(has('art') && has('money')) label = 'ART + MONEY → COMMERCIAL ARTIST';
      if(has('art') && has('sanity')) label = 'ART + SANITY → SOLITARY CREATOR';
      if(has('money') && has('sanity')) label = 'MONEY + SANITY → PRAGMATIC DESIGNER';
      // 选满 2 个后延时自动收起
      clearTimeout(collapseTimer);
      collapseTimer = setTimeout(collapsePanel, 450);
    }
    statusEl.textContent = label || 'Pick exactly TWO options.';
    countEl.textContent  = `${arr.length} / 2`;
  }

  chipSpans.forEach(span => {
    const k = span.dataset.key;
    span.parentElement.addEventListener('click', () => {
      if(chosen.has(k)){
        chosen.delete(k);
      }else{
        if(chosen.size >= 2){
          const first = chosen.values().next().value;
          chosen.delete(first);
          const toOff = chipSpans.find(s => s.dataset.key === first);
          if(toOff) toOff.parentElement.classList.remove('active');
        }
        chosen.add(k);
      }
      // visual state
      chipSpans.forEach(s => s.parentElement.classList.toggle('active', chosen.has(s.dataset.key)));
      updateStatus();
    });
  });

  // 点击状态栏可重新展开面板
  statusEl.addEventListener('click', expandPanel);
  // 键盘 R 也可展开
  window.addEventListener('keydown', (e) => {
    if(e.key.toLowerCase() === 'r') expandPanel();
  });

  // ===== Pixel canvas =====
  const screen = document.getElementById('screen');
  const ctx = screen.getContext('2d');

  const W_BASE = 320, H_BASE = 180;
  const off = document.createElement('canvas'); off.width = W_BASE; off.height = H_BASE;
  const p = off.getContext('2d', { alpha:false });
  ctx.imageSmoothingEnabled = false;

  function fitCanvas(){
    const w = screen.parentElement.clientWidth;
    const h = Math.max(220, screen.parentElement.clientHeight);
    const s = Math.max(1, Math.floor(Math.min(w / W_BASE, h / H_BASE)));
    const tw = W_BASE * s, th = H_BASE * s;
    screen.width = tw; screen.height = th;
    screen.style.width = tw + 'px'; screen.style.height = th + 'px';
  }
  fitCanvas(); window.addEventListener('resize', fitCanvas);

  // ===== Palette =====
  const C = {
    bgDeep:'#0a0d16', wallTop:'#0d1020', wallBot:'#0b0e19', floor:'#131728',
    woodDark:'#2a1b12', wood:'#3a2418', woodHL:'#5b3824',
    lampShade:'#2b2b46', lampCore:'#ffe7b9',
    monitor:'#0a0f1e', monitorGlass:'#132448',
    neon1:'#9f80ff', neon2:'#f39bff', neon3:'#79d3ff',
    paper:'#f9f9ef', paperShadow:'#c9c9ba',
    sticky:'#ffe38d', sticky2:'#ffd2f3', sticky3:'#c0f2ff',
    box:'#d29a5a', box2:'#b57a3e',
    coffeeDark:'#3b2a1d', coffeeGlass:'#8b735b', puddle:'#384b6e',
    calc:'#1c2236', calcBtn:'#303954',
    pig:'#f3a7c1', coin:'#ffd26a',
    plant:'#226a4b', plantHL:'#2d8b61',
    text:'#c8d2ff',
    green:'#44d37a', red:'#ff6a6a', blue:'#6aa7ff', gray:'#8892a7', teal:'#47e2d6'
  };

  // ===== Helpers =====
  function rect(x,y,w,h,color){ p.fillStyle=color; p.fillRect(x|0,y|0,w|0,h|0); }
  function dropShadowRect(x,y,w,h,body,shadow){ rect(x+1,y+1,w,h,shadow); rect(x,y,w,h,body); }

  // ===== Tiny 3x5 bitmap font for on-canvas captions =====
  const FONT={};
  function putGlyph(ch,rows){ FONT[ch]=rows.map(r=>r.padEnd(3,'0').slice(0,3)); }
  const GLYPH_SRC={
    'A':['010','101','111','101','101'],'B':['110','101','110','101','110'],'C':['011','100','100','100','011'],
    'D':['110','101','101','101','110'],'E':['111','100','110','100','111'],'F':['111','100','110','100','100'],
    'G':['011','100','101','101','011'],'H':['101','101','111','101','101'],'I':['111','010','010','010','111'],
    'J':['111','001','001','101','010'],'K':['101','101','110','101','101'],'L':['100','100','100','100','111'],
    'M':['101','111','111','101','101'],'N':['101','111','111','111','101'],'O':['010','101','101','101','010'],
    'P':['110','101','110','100','100'],'Q':['010','101','101','111','011'],'R':['110','101','110','101','101'],
    'S':['011','100','010','001','110'],'T':['111','010','010','010','010'],'U':['101','101','101','101','111'],
    'V':['101','101','101','101','010'],'W':['101','101','111','111','101'],'X':['101','101','010','101','101'],
    'Y':['101','101','010','010','010'],'Z':['111','001','010','100','111'],
    '0':['111','101','101','101','111'],'1':['010','110','010','010','111'],'2':['111','001','111','100','111'],
    '3':['111','001','111','001','111'],'4':['101','101','111','001','001'],'5':['111','100','111','001','111'],
    '6':['111','100','111','101','111'],'7':['111','001','001','010','010'],'8':['111','101','111','101','111'],
    '9':['111','101','111','001','111'],'-':['000','000','111','000','000'],' ':[ '000','000','000','000','000'],
    '$':['010','111','010','111','010']
  };
  for(const [ch,rows] of Object.entries(GLYPH_SRC)) putGlyph(ch,rows);
  function writeText(x,y,str,color){
    const s = (str||'').toUpperCase();
    for(let i=0;i<s.length;i++) drawChar(x+i*6,y,s[i],color);
  }
  function drawChar(x,y,ch,color){
    const g=FONT[ch]; if(!g){ rect(x+1,y+2,3,3,color); return; }
    for(let r=0;r<5;r++) for(let c=0;c<3;c++) if(g[r][c]==='1') rect(x+c,y+r,1,1,color);
  }

  // Starfield
  const stars = Array.from({length: 120}, () => ({
    x: Math.random()*W_BASE, y: Math.random()*60+6, z: Math.random()*1+0.4,
    c: ['#9cc9ff','#e8b5ff','#fff5c4'][(Math.random()*3)|0]
  }));

  // ===== Scene base (window, desk, lamp) =====
  function drawWindow(t){
    const x=14,y=10,w=120,h=60;
    rect(x-3,y-3,w+6,4,'#182037'); rect(x-3,y+h-1,w+6,4,'#0c1121');
    rect(x-3,y,3,h,'#11182f'); rect(x+w,y,3,h,'#11182f');
    rect(x,y,w,h,'#0a0f1e'); rect(x+2,y+2,w-4,h-4,'#0a0b14');
    for(const s of stars){
      const sx = x+2 + ((s.x + Math.sin((t/20000)*s.z + s.y)*8) % (w-4));
      const sy = y+2 + s.y; rect(sx,sy,1,1,s.c); if(Math.random()<0.002) rect(sx+1,sy,1,1,s.c);
    }
    rect(x+16,y+10,56,2,C.neon3); rect(x+16,y+12,56,2,C.neon2); rect(x+16,y+14,56,2,C.neon1);
    const baseY=y+h-10;
    for(let i=0;i<8;i++){
      const bx=x+6+i*14+(i%2?3:0), bw=10, bh=6+(i%3)*4;
      rect(bx,baseY-bh,bw,bh,i%2?'#0f1426':'#0d1321');
      if(Math.random()<0.2) rect(bx+2, baseY-bh+2,2,1,'#ffefaa');
    }
  }
  function drawDesk(){
    rect(0,120,W_BASE,2,C.woodHL); rect(0,122,W_BASE,30,C.wood);
    for(let i=0;i<200;i++){ const gx=(Math.random()*W_BASE)|0, gy=122+((Math.random()*28)|0); rect(gx,gy,1,1,Math.random()<0.5?'#3c281b':'#402b1d'); }
    rect(0,152,W_BASE,10,C.woodDark);
  }
  function drawLamp(t){
    const baseX=240, baseY=40;
    rect(baseX,baseY,2,30,'#2b2e45'); rect(baseX-20,baseY+30,40,2,'#2c314f');
    rect(baseX-6,baseY+28,16,8,'#2b2b46'); rect(baseX-8,baseY+36,20,2,'#22243a');
    const flick = 0.85 + 0.15*Math.sin(t/120) + 0.05*Math.sin(t/53);
    for(let i=0;i<26;i++){ const a=(0.12-i*0.004)*flick; if(a<=0) continue; p.fillStyle=`rgba(255,217,163,${a.toFixed(3)})`; rect(210+i,46+i,40,1); rect(210+i,47+i,42,1); }
    rect(baseX+1,baseY+34,2,2,C.lampCore);
  }

  // ===== Monitor area =====
  const MON = { x:150,y:60,w:110,h:70 };
  function drawMonitorBase(t){
    const {x,y,w,h}=MON;
    rect(x-2,y-2,w+4,2,'#12182e'); rect(x-2,y+h,w+4,2,'#0c1020');
    rect(x-2,y,2,h,'#0f152b'); rect(x+w,y,2,h,'#0f152b');
    rect(x,y,w,h,C.monitor);
    rect(x+3,y+3,w-6,h-6,C.monitorGlass);
    const scanY = 3 + ((t/30)|0 % (h-6));
    p.globalAlpha=.08; rect(x+3,y+scanY,w-6,1,'#7da1ff'); p.globalAlpha=1;
  }

  // ---- Monitor overlays per ending ----
  function monitorCommercial(t){
    const {x,y,w,h}=MON;
    rect(x+5,y+5,w-10,6,'#12234a'); writeText(x+8,y+6,'ORDERS',C.text);
    rect(x+w-18,y+6,3,3,C.red); rect(x+w-14,y+6,3,3,C.red);
    dropShadowRect(x+7,y+14,48,22,'#0f1a36','#071027');
    for(let i=0;i<4;i++){ rect(x+9,y+16+i*5,40,1,'#34508a'); rect(x+10,y+17+i*5,14,1,'#6db6ff'); rect(x+26,y+17+i*5,8,1,'#a9ffbb'); }
    dropShadowRect(x+58,y+14,44,22,'#0e1830','#061024');
    for(let i=0;i<8;i++){ const bh = 4 + ((Math.sin((t/350)+i)*0.5+0.5)*12|0); rect(x+60+i*5, y+34-bh, 3, bh, '#46d07a'); }
    dropShadowRect(x+7,y+38,95,12,'#0f1a36','#071027');
    writeText(x+10,y+40,'PAID',C.green);
    const dots = ((t/300)|0)%10; for(let i=0;i<dots;i++) rect(x+42+i*3,y+41,2,1,C.green);
    writeText(x+70,y+40,'$ IN',C.text);
    if(((t/400)|0)%2===0) writeText(x+64,y+6,'NEW!',C.red);
  }
  function monitorCreator(t){
    const {x,y,w,h}=MON;
    rect(x+5,y+5,w-10,6,'#14233c'); writeText(x+8,y+6,'UNTITLED*',C.text);
    dropShadowRect(x+8,y+14,w-16,h-26,'#0b1326','#050a18');
    for(let i=0;i<4;i++){ dropShadowRect(x+10,y+16+i*12,10,8,'#1a2a4d','#0a1224'); rect(x+11,y+17+i*12,8,6,['#8fb0ff','#ffd0f0','#9ff6e8','#ffe99a'][i]); }
    dropShadowRect(x+24,y+20,58,36,'#0e1a34','#091024'); rect(x+26,y+22,54,32,'#0b1530');
    if(((t/500)|0)%2===0) rect(x+28,y+24,1,10,'#8fb0ff');
    dropShadowRect(x+w-22,y+16,14,10,'#2a1f2a','#140e14'); writeText(x+w-20,y+19,'BREATHE','#c09ab8');
    rect(x+10,y+h-15,50,6,'#0e1a34'); rect(x+12,y+h-13,12,2,'#6aa7ff'); writeText(x+28,y+h-14,'PAUSE',C.gray);
    rect(x+w-16,y+6,3,3,C.gray);
  }
  function monitorPragmatic(t){
    const {x,y,w,h}=MON;
    rect(x+5,y+5,w-10,6,'#102235'); writeText(x+8,y+6,'DASHBOARD',C.text);
    dropShadowRect(x+8,y+14,60,30,'#0c1a2a','#07121e');
    for(let gx=x+10; gx<x+66; gx+=4) rect(gx,y+16,1,26,'#16344a');
    for(let gy=y+16; gy<y+42; gy+=4) rect(x+10,gy,54,1,'#16344a');
    for(let r=0;r<5;r++) rect(x+12,y+18+r*4,2,2,C.green);
    dropShadowRect(x+70,y+14,30,30,'#0c1a2a','#07121e');
    for(let i=0;i<4;i++){ const bh = 4 + i*4; rect(x+72+i*7, y+42-bh, 5, bh, '#5aa2e6'); }
    dropShadowRect(x+8,y+46,w-16,10,'#0c1a2a','#07121e');
    for(let i=0;i<6;i++) rect(x+10+i*14,y+48,12,6,'#153044');
    writeText(x+w-38,y+47,'9-5',C.teal);
    dropShadowRect(x+30,y+26,50,16,'#11243a','#061221'); writeText(x+40,y+30,'SUCCESS',C.text);
    rect(x+36,y+38,38,2,'#1d3350'); rect(x+36,y+38,38,2,'#79d7a6');
    rect(x+w-16,y+6,3,3,'#2a3952');
  }

  // ===== Desk props per combination =====
  function drawKeyboard(){const x=120,y=137,w=90,h=8; rect(x,y,w,h,'#0f1528'); for(let i=0;i<14;i++) rect(x+3+i*6,y+2,5,2,'#1b2342'); rect(x+w+6,y+2,8,4,'#1a2040');}
  function drawPlant(){const x=24,y=128; rect(x,y,12,8,'#2d1f13'); rect(x+1,y-1,10,6,'#3a281a'); rect(x+2,y-6,8,5,'#442f1d'); rect(x+4,y-10,2,4,C.plant); rect(x+7,y-11,2,5,C.plant); rect(x+6,y-14,1,3,C.plantHL); rect(x+2,y-12,1,3,C.plant);}

  function artMoneyProps(t){
    writeText(22,22,'$$ RUSH',C.green);
    for(let s=0;s<4;s++){const x=46+s*18,y=126-s*3; dropShadowRect(x,y,30,20,C.paper,'#999b9f'); for(let i=0;i<7;i++) rect(x+3,y+3+i*2,24,1,'#c6cad2'); rect(x+18,y+13,9,3,'#ff8b8b');}
    dropShadowRect(100,134,24,16,C.box,'#7a522c'); rect(100,134,24,2,C.box2); rect(104,141,10,2,'#7c5735');
    dropShadowRect(124,138,18,12,C.box2,'#694a2a'); rect(130,143,6,2,'#7c5735');
    dropShadowRect(208,130,18,12,'#2a2f48','#0e1326'); rect(210,132,14,2,'#414b71');
    const spit=4+((t/200)|0)%8; dropShadowRect(212,134,12,spit,C.paper,'#9aa0a6'); for(let i=0;i<Math.min(3,spit-2);i++) rect(214,135+i*2,8,1,'#c6cad2');
    dropShadowRect(148,140,36,12,'#0e1428','#0a0f20'); rect(150,142,32,8,'#101a34'); rect(186,144,6,2,'#d8d8d8');
  }
  function artSanityProps(t){
    writeText(24,22,'QUIET',C.blue);
    dropShadowRect(68,132,40,24,C.paper,C.paperShadow); for(let i=0;i<4;i++) rect(72,136+i*4,28,1,'#b2b8c6'); rect(100,133,2,22,'#bdbdb3');
    dropShadowRect(120,134,10,12,C.coffeeGlass,'#2c364a'); rect(122,136,6,6,C.coffeeDark); rect(118,146,14,2,C.puddle);
    dropShadowRect(208,136,6,10,'#f3e0b6','#7e6b3c'); const fy=133+((Math.sin(t/180)*1)|0); rect(211,fy,1,2,'#ffd983');
    dropShadowRect(220,132,16,12,C.sticky2,'#704a64'); writeText(222,135,'BREATHE','#a96d8f');
  }
  function moneySanityProps(t){
    writeText(26,22,'9-5',C.teal);
    dropShadowRect(58,130,64,26,'#0f2330','#07151d'); for(let gx=60;gx<120;gx+=4) rect(gx,132,1,22,'#123444'); for(let gy=132;gy<154;gy+=4) rect(60,gy,58,1,'#123444');
    dropShadowRect(124,130,36,6,'#314d66','#122636'); for(let i=0;i<9;i++) rect(126+i*4,132,1,2,'#a6c0d6');
    dropShadowRect(164,134,26,16,C.calc,'#0e1326'); rect(166,136,22,4,'#20294a'); for(let r=0;r<3;r++) for(let c=0;c<4;c++) rect(168+c*5,141+r*3,4,2,C.calcBtn);
  }

  function drawCaption(sel){
    const x=16,y=160;
    let txt=''; if(sel.includes('art') && sel.includes('money')) txt='COMMERCIAL ARTIST';
    if(sel.includes('art') && sel.includes('sanity')) txt='SOLITARY CREATOR';
    if(sel.includes('money') && sel.includes('sanity')) txt='PRAGMATIC DESIGNER';
    dropShadowRect(x,y, txt.length*6+8, 10, '#12182a', '#0a0f20'); writeText(x+4,y+3,txt,C.text);
  }

  // ===== Main loop =====
  function draw(){
    const t = performance.now();

    // Background gradient
    const grad = p.createLinearGradient(0,0,0,H_BASE);
    grad.addColorStop(0,C.wallTop); grad.addColorStop(.6,C.wallBot); grad.addColorStop(1,C.floor);
    p.fillStyle=grad; p.fillRect(0,0,W_BASE,H_BASE);

    drawWindow(t);
    drawDesk();
    drawLamp(t);

    // Monitor base
    drawMonitorBase(t);

    // Keyboard + plant
    drawKeyboard(); drawPlant();

    // Combo
    const sel=[...chosen];
    if(sel.length===2){
      if(sel.includes('art') && sel.includes('money')) monitorCommercial(t);
      if(sel.includes('art') && sel.includes('sanity')) monitorCreator(t);
      if(sel.includes('money') && sel.includes('sanity')) monitorPragmatic(t);

      if(sel.includes('art') && sel.includes('money')) artMoneyProps(t);
      if(sel.includes('art') && sel.includes('sanity')) artSanityProps(t);
      if(sel.includes('money') && sel.includes('sanity')) moneySanityProps(t);

      drawCaption(sel);
    } else {
      writeText(18,160,'SELECT ANY TWO: ART MONEY SANITY','#a9b4e6');
    }

    // Upscale
    ctx.clearRect(0,0,screen.width,screen.height);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(off,0,0,screen.width,screen.height);

    requestAnimationFrame(draw);
  }

  updateStatus();
  draw();
})();
</script>
</body>
</html>
